name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Uses the deterministic hash embedder: no model download.
      - run: npm test

  retrieval-quality:
    name: Retrieval quality (real model)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agent-memory-store
          key: hf-${{ hashFiles('src/embeddings.js', 'package-lock.json') }}
      - run: AMS_MODEL_TESTS=1 node --no-warnings --test test/e2e-model.test.js
      - run: npm run bench
